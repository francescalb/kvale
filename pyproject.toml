[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvale"
version = "0.1.0"
description = "Et lite program som gjør det lettere å designe kvaler."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3.0" }
authors = [{ name = "Francesca L. Bleken" }]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.8", "types-Pillow"]

[project.scripts]
kvale = "kvale.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
