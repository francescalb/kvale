<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvale mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS START (kept identical to docs/design/tokens.css) ===== */
:root {
  /* Light theme: unbleached linen, walnut ink, madder-red thread */
  --bg: #f4efe6;
  --bg-weave: rgba(120, 95, 60, 0.045);
  --surface: #fbf8f2;
  --surface-2: #efe8dc;
  --surface-sunken: #e9e1d3;
  --border: #d8ccb8;
  --border-strong: #a8998a;
  --text: #2a2420;
  --text-muted: #635a50;
  --accent: #9e1b2c;
  --accent-hover: #841523;
  --accent-text: #ffffff;
  --accent-soft: #f4dfdc;
  --accent-soft-text: #7a1220;
  --focus: #2f5d9e;
  --notice-bg: #fbf0d6;
  --notice-border: #e0c27a;
  --notice-text: #5a4210;
  --stage: #e8e0d2;
  --swatch-ring: rgba(0, 0, 0, 0.25);
  --shadow: 0 1px 2px rgba(60, 40, 20, 0.08), 0 6px 18px rgba(60, 40, 20, 0.08);
  --cloth-line: rgba(70, 50, 30, 0.16);
  --cloth-line-strong: rgba(70, 50, 30, 0.38);
  --axis: rgba(158, 27, 44, 0.55);
  --edge-tint: rgba(47, 93, 158, 0.16);

  /* Type */
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --text-xs: 0.8125rem;
  --text-sm: 0.9375rem;
  --text-md: 1.0625rem;
  --text-lg: 1.25rem;
  --text-xl: 1.625rem;

  /* Spacing (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* Radii and sizes */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --hit: 44px;
  --panel-width: 368px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1815;
    --bg-weave: rgba(255, 240, 220, 0.025);
    --surface: #25211d;
    --surface-2: #2f2a25;
    --surface-sunken: #171411;
    --border: #463e36;
    --border-strong: #7a6e62;
    --text: #f2ece3;
    --text-muted: #b8ad9f;
    --accent: #e8838b;
    --accent-hover: #f09aa1;
    --accent-text: #1b1815;
    --accent-soft: #4a262a;
    --accent-soft-text: #ffd4d7;
    --focus: #8fb4ec;
    --notice-bg: #3a3020;
    --notice-border: #7d6630;
    --notice-text: #f3dfae;
    --stage: #13110f;
    --swatch-ring: rgba(255, 255, 255, 0.5);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #1b1815;
  --bg-weave: rgba(255, 240, 220, 0.025);
  --surface: #25211d;
  --surface-2: #2f2a25;
  --surface-sunken: #171411;
  --border: #463e36;
  --border-strong: #7a6e62;
  --text: #f2ece3;
  --text-muted: #b8ad9f;
  --accent: #e8838b;
  --accent-hover: #f09aa1;
  --accent-text: #1b1815;
  --accent-soft: #4a262a;
  --accent-soft-text: #ffd4d7;
  --focus: #8fb4ec;
  --notice-bg: #3a3020;
  --notice-border: #7d6630;
  --notice-text: #f3dfae;
  --stage: #13110f;
  --swatch-ring: rgba(255, 255, 255, 0.5);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
}
:root[data-theme="light"] {
  --bg: #f4efe6;
  --bg-weave: rgba(120, 95, 60, 0.045);
  --surface: #fbf8f2;
  --surface-2: #efe8dc;
  --surface-sunken: #e9e1d3;
  --border: #d8ccb8;
  --border-strong: #a8998a;
  --text: #2a2420;
  --text-muted: #635a50;
  --accent: #9e1b2c;
  --accent-hover: #841523;
  --accent-text: #ffffff;
  --accent-soft: #f4dfdc;
  --accent-soft-text: #7a1220;
  --focus: #2f5d9e;
  --notice-bg: #fbf0d6;
  --notice-border: #e0c27a;
  --notice-text: #5a4210;
  --stage: #e8e0d2;
  --swatch-ring: rgba(0, 0, 0, 0.25);
  --shadow: 0 1px 2px rgba(60, 40, 20, 0.08), 0 6px 18px rgba(60, 40, 20, 0.08);
}
/* ===== TOKENS END ===== */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--text-md);
  line-height: 1.45;
  color: var(--text);
  background-color: var(--bg);
  /* very faint plain weave */
  background-image:
    repeating-linear-gradient(0deg, var(--bg-weave) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, var(--bg-weave) 0 1px, transparent 1px 4px);
  min-height: 100vh;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.icon { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--hit); min-width: var(--hit); padding: 0 var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); color: var(--text);
  font-weight: 700; font-size: var(--text-sm); white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.icon-only { padding: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-md);
}
.seg button {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 40px; min-width: 40px; padding: 0 var(--space-3);
  border: 0; border-radius: 7px; background: transparent; color: var(--text-muted);
  font-weight: 700; font-size: var(--text-sm); white-space: nowrap;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 0 0 1px var(--border); }
.seg.accent button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); box-shadow: none; }

/* ---------- Top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
  padding: var(--space-3) var(--space-5);
  background: var(--surface);
  border-bottom: 2px dashed var(--border); /* running stitch */
}
.brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; margin-right: auto; }
.logo { width: 34px; height: 34px; flex: none; color: var(--accent); }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); letter-spacing: .01em; line-height: 1; }
.docinfo { display: flex; flex-direction: column; min-width: 0; padding-left: var(--space-3); border-left: 1px solid var(--border); }
.docname { font-weight: 700; font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.autosave { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-muted); }
.autosave .dot { width: 8px; height: 8px; border-radius: 50%; background: #3d8b4f; flex: none; }
.file-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.prefs { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.prefs .seg button { min-width: 44px; padding: 0 var(--space-2); }

/* ---------- Workspace ---------- */
.workspace {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-width);
  gap: var(--space-5); padding: var(--space-5); align-items: start;
}
.stage {
  background: var(--stage); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-width: 0; min-height: 560px;
  position: sticky; top: var(--space-5);
}
.stage-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
  padding: var(--space-3); border-bottom: 1px solid var(--border);
}
.stage-toolbar .spacer { flex: 1; }
.toolgroup { display: inline-flex; align-items: center; gap: 4px; }
.zoom-label { min-width: 44px; text-align: center; font-size: var(--text-sm); font-variant-numeric: tabular-nums; color: var(--text-muted); }
.chip { display: inline-block; width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--swatch-ring); flex: none; }

.stage-body { flex: 1; padding: var(--space-5); overflow: auto; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }

/* Edit grid with rulers */
.editor {
  --ruler: 30px;
  position: relative;
  display: grid; grid-template-columns: var(--ruler) auto; grid-template-rows: var(--ruler) auto;
}
.ruler { display: flex; }
.ruler-top { grid-column: 2; grid-row: 1; }
.ruler-left { grid-column: 1; grid-row: 2; flex-direction: column; }
.ruler button {
  flex: none; border: 0; background: transparent; padding: 0;
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  font-variant-numeric: tabular-nums; border-radius: 4px; position: relative;
}
.ruler-top button { height: var(--ruler); }
.ruler-left button { width: var(--ruler); }
.ruler button:hover, .ruler button[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent-soft-text); }
.ruler button:hover::after { content: "+"; position: absolute; font-size: 10px; right: 2px; top: 0; }
.cloth { grid-column: 2; grid-row: 2; box-shadow: var(--shadow); border-radius: 2px; touch-action: none; display: block; cursor: crosshair; }
.corner { grid-column: 1; grid-row: 1; }

.popover {
  position: absolute; z-index: 5; width: 250px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow);
  padding: var(--space-2);
}
.popover h3 { margin: var(--space-1) var(--space-2) var(--space-2); font-size: var(--text-sm); display: flex; justify-content: space-between; align-items: center; }
.popover .btn { width: 100%; justify-content: flex-start; min-height: 42px; border-color: transparent; background: transparent; font-weight: 400; }
.popover .btn:hover { background: var(--surface-2); }
.popover .btn.danger { color: var(--accent); }
.popover .close { width: 36px; min-width: 36px; min-height: 36px; padding: 0; justify-content: center; }

.legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); font-size: var(--text-sm); color: var(--text-muted); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: var(--space-2); }
.legend .key { width: 22px; height: 22px; border-radius: 2px; background: #b1172b; position: relative; }
.legend .key.seed::after { content: ""; position: absolute; inset: 4px; border: 2px solid #fff; }
.hint { margin: 0; font-size: var(--text-sm); color: var(--text-muted); text-align: center; max-width: 52ch; }

.edit-layout { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: var(--space-6); }
.edit-side { flex: 1 1 260px; max-width: 340px; display: flex; flex-direction: column; gap: var(--space-4); padding-top: 30px; }
.edit-side .legend { flex-direction: column; justify-content: flex-start; }
.edit-side .hint { text-align: left; }
.edit-layout.narrow .edit-side { max-width: 100%; flex-basis: 100%; padding-top: 0; }
.edit-layout.narrow .legend { flex-direction: row; justify-content: center; }
.edit-layout.narrow .hint { text-align: center; margin: 0 auto; }
.miniband {
  width: 100%; max-width: 760px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2);
}
.miniband header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.miniband h3 { margin: 0; font-size: var(--text-sm); }
.miniband canvas { display: block; max-width: 100%; border-radius: 2px; }
.preview-wrap { max-width: 100%; overflow: auto; padding: 4px; }
.preview-wrap canvas { display: block; box-shadow: var(--shadow); border-radius: 2px; }
.caption { font-size: var(--text-sm); color: var(--text-muted); }

/* ---------- Side panel ---------- */
.panel { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); }
.card > h2 {
  margin: 0 0 var(--space-3); font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg);
  display: flex; align-items: center; gap: var(--space-2);
}
.card > h2::after { content: ""; flex: 1; border-top: 2px dashed var(--border); margin-left: var(--space-2); }
.card p.intro { margin: 0 0 var(--space-3); font-size: var(--text-sm); color: var(--text-muted); }
.subhead { margin: var(--space-4) 0 var(--space-2); font-size: var(--text-sm); font-weight: 700; }
.subhead small { font-weight: 400; color: var(--text-muted); display: block; }

/* Colour slots */
.slots { display: flex; flex-direction: column; gap: var(--space-2); }
.slot { display: flex; align-items: stretch; gap: var(--space-2); }
.slot-select {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-3);
  min-height: 52px; padding: var(--space-2) var(--space-3);
  border: 2px solid var(--border); border-radius: var(--radius-md); background: var(--surface); text-align: left;
}
.slot-select:hover { border-color: var(--border-strong); }
.slot-select[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.slot-num { font-weight: 700; font-variant-numeric: tabular-nums; width: 2.2em; flex: none; }
.slot-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.swatchbar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--swatch-ring); }
.swatchbar i { flex: 1; }
.slot-meta { font-size: var(--text-xs); color: var(--text-muted); display: flex; justify-content: space-between; gap: var(--space-2); }
.slot-select[aria-pressed="true"] .slot-meta { color: var(--accent-soft-text); }
.slot-edit { flex: none; }
.row { display: flex; align-items: center; gap: var(--space-3); }
.toggle-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) 0 0; }
.toggle-row .text { flex: 1; min-width: 0; }
.toggle-row .text strong { display: block; font-size: var(--text-sm); }
.toggle-row .text span { display: block; font-size: var(--text-xs); color: var(--text-muted); }
.switch {
  position: relative; flex: none; width: 52px; height: 32px; border-radius: var(--radius-pill);
  border: 2px solid var(--border-strong); background: var(--surface-sunken); padding: 0;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--border-strong); transition: transform .15s;
}
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--accent-text); }
.switch-wrap { display: flex; align-items: center; min-height: var(--hit); }
.bg-row { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border); }
.bg-swatch { width: 44px; height: 44px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--swatch-ring);
  background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 5px), repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 5px); }
.bg-row .text { flex: 1; font-size: var(--text-sm); }
.bg-row .text span { display: block; color: var(--text-muted); font-size: var(--text-xs); }
.visually-hidden-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

/* Symmetry */
.sym-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.sym {
  display: flex; align-items: center; gap: var(--space-2); min-height: 60px; padding: var(--space-2);
  border: 2px solid var(--border); border-radius: var(--radius-md); background: var(--surface); text-align: left;
  font-size: var(--text-sm); line-height: 1.2; position: relative;
}
.sym:hover:not(:disabled) { border-color: var(--border-strong); }
.sym[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-soft-text); }
.sym svg { width: 42px; height: 42px; flex: none; }
.sym .lbl { display: flex; flex-direction: column; min-width: 0; }
.sym .lbl small { font-size: var(--text-xs); color: var(--text-muted); }
.sym[aria-pressed="true"] .lbl small { color: inherit; }
.sym.locked { cursor: default; }
.sym:disabled { cursor: not-allowed; background: repeating-linear-gradient(135deg, var(--surface) 0 6px, var(--surface-2) 6px 12px); color: var(--text-muted); }
.sym:disabled svg { opacity: .45; }
.sym .tick { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: none; align-items: center; justify-content: center; }
.sym[aria-pressed="true"] .tick { display: flex; }
.sym .tick svg { width: 12px; height: 12px; stroke-width: 3; }
.notice {
  display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md);
  background: var(--notice-bg); border: 1px solid var(--notice-border); color: var(--notice-text); font-size: var(--text-sm);
}
.notice .btn { margin-top: var(--space-2); min-height: 40px; }

/* Grid settings */
.fieldgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.field label { display: block; font-size: var(--text-sm); font-weight: 700; margin-bottom: 4px; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--border-strong); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
.stepper button { width: 40px; min-height: var(--hit); border: 0; background: var(--surface-2); font-size: 1.25rem; font-weight: 700; flex: none; }
.stepper button:hover { background: var(--surface-sunken); }
.stepper input { width: 100%; min-width: 0; border: 0; text-align: center; font-weight: 700; font-size: var(--text-md); background: transparent; -moz-appearance: textfield; font-variant-numeric: tabular-nums; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field .unit { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }

.edges { margin-top: var(--space-2); }
.edges-explain { font-size: var(--text-sm); color: var(--text-muted); margin: 0 0 var(--space-3); }
.edges-diagram { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--space-3); background: var(--surface-sunken); border-radius: var(--radius-md); margin-bottom: var(--space-2); }
.edges-diagram svg { max-width: 100%; height: auto; }
.edges-diagram .caption { font-size: var(--text-xs); }
.diagram-key { display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center; font-size: var(--text-xs); color: var(--text-muted); }
.diagram-key span { display: inline-flex; align-items: center; gap: 4px; }
.diagram-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.edge-list .toggle-row { padding-top: var(--space-2); }

/* ---------- Dialog ---------- */
dialog {
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0;
  background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35);
  width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
}
dialog::backdrop { background: rgba(30, 22, 15, .45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 26px); }
.dlg header { padding: var(--space-4) var(--space-5) 0; }
.dlg h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); }
.dlg header p { margin: var(--space-1) 0 0; color: var(--text-muted); font-size: var(--text-sm); }
.dlg .content { padding: var(--space-4) var(--space-5); overflow: auto; display: flex; flex-direction: column; gap: var(--space-4); }
.dlg footer { padding: var(--space-3) var(--space-5) var(--space-4); display: flex; justify-content: flex-end; gap: var(--space-2); border-top: 1px solid var(--border); }
.bigbar { display: flex; height: 44px; border-radius: var(--radius-sm); overflow: hidden; box-shadow: inset 0 0 0 1px var(--swatch-ring); }
.bigbar i { flex: 1; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; }
.part {
  width: 44px; height: 44px; border-radius: var(--radius-sm); border: 2px solid var(--border);
  font-weight: 700; font-size: var(--text-sm); display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 2px var(--surface);
}
.part[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 3px var(--surface), 0 0 0 2px var(--text); }
.threads { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.thread { height: 44px; border-radius: var(--radius-sm); border: 2px solid transparent; box-shadow: inset 0 0 0 1px var(--swatch-ring); }
.thread[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 2px var(--surface); }
.custom-colour { position: relative; }
.repeats-row { display: flex; gap: 4px; flex-wrap: wrap; }
.repeats-row span { width: 34px; height: 34px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: 700; box-shadow: inset 0 0 0 1px var(--swatch-ring); }
.dlg .label { font-weight: 700; font-size: var(--text-sm); margin: 0 0 var(--space-2); }
.dlg .stepper { max-width: 180px; }

/* ---------- Loading screen ---------- */
.loading {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(0deg, var(--bg-weave) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, var(--bg-weave) 0 1px, transparent 1px 4px);
  padding: var(--space-5);
}
.loading-inner { text-align: center; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
.loading .wordmark { font-size: 2.75rem; }
.stitch-row { width: 260px; max-width: 100%; height: auto; color: var(--accent); }
.stitch-row path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: stitch 2.8s infinite; }
@keyframes stitch { 0% { stroke-dashoffset: 26; } 30%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.thread-bar { width: 260px; max-width: 100%; height: 4px; border-radius: 2px; background: var(--surface-sunken); overflow: hidden; }
.thread-bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 2px; animation: pull 1.6s ease-in-out infinite; }
@keyframes pull { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
.loading h1 { margin: 0; font-size: var(--text-lg); font-weight: 700; }
.loading p { margin: 0; color: var(--text-muted); font-size: var(--text-sm); }
@media (prefers-reduced-motion: reduce) {
  .stitch-row path { animation: none; stroke-dashoffset: 0; }
  .thread-bar::after { animation: none; width: 60%; }
  .switch::after { transition: none; }
}

/* ---------- Edit view: "drawing in" bar and end pieces ---------- */
.edit-view { width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
.targetbar { width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--space-2) var(--space-3); }
.targetbar .tlabel { font-size: var(--text-sm); font-weight: 700; color: var(--text-muted); }
.targetseg button { position: relative; gap: 6px; }
.targetseg svg.ticon { width: 30px; height: 20px; flex: none; }
.targetseg .changed { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

.endpanel {
  width: 100%; max-width: 1000px; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-5);
  padding: var(--space-3) var(--space-4); background: var(--surface);
  border: 2px dashed var(--accent); border-radius: var(--radius-md);
}
.endpanel .who { flex: 1 1 320px; min-width: 0; display: flex; gap: var(--space-3); align-items: flex-start; }
.endpanel .who svg { width: 46px; height: 30px; flex: none; margin-top: 4px; }
.endpanel h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); line-height: 1.2; }
.endpanel p { margin: 2px 0 0; font-size: var(--text-sm); color: var(--text-muted); }
.endpanel .endsummary { font-size: var(--text-xs); margin-top: 4px; color: var(--text); }
.endpanel .ext { display: flex; flex-direction: column; gap: 2px; }
.endpanel .ext label { font-size: var(--text-sm); font-weight: 700; }
.endpanel .ext .stepper { width: 150px; }
.endpanel .ext small { font-size: var(--text-xs); color: var(--text-muted); }
.endpanel .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.btn.danger-text { color: var(--accent); }

/* legend keys */
.legend .key { width: 22px; height: 22px; border-radius: 2px; background: #a7132b; position: relative; flex: none; }
.legend .k-seed::after, .legend .k-added::after { content: ""; position: absolute; inset: 4px; border: 2px solid #fff; }
.legend .k-back { background: transparent; }
.legend .k-back::after { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 3px; border-radius: 2px; background: var(--text); transform: rotate(-35deg); }
.legend .k-removed { background: #f5f1e8; box-shadow: inset 0 0 0 1px var(--swatch-ring); }
.legend .k-removed::before, .legend .k-removed::after { content: ""; position: absolute; left: 3px; right: 3px; top: 10px; height: 2px; background: #b3261e; transform: rotate(45deg); }
.legend .k-removed::after { transform: rotate(-45deg); }
.legend .k-extra { background: #e6e3e2; box-shadow: inset 0 0 0 2px rgba(47, 93, 158, .55); }
.legend .k-nb { opacity: .35; }

.miniband canvas { cursor: pointer; }
.miniband .hint { text-align: left; font-size: var(--text-xs); }

/* ruler in end-piece mode: labels only */
.ruler button:disabled { cursor: default; }
.ruler button:disabled:hover { background: transparent; color: var(--text-muted); }
.ruler button:disabled:hover::after { content: none; }
.ruler button.extra { color: var(--focus); }

.popover .note { margin: var(--space-1) var(--space-2) var(--space-2); font-size: var(--text-xs); color: var(--text-muted); }
.popover .btn.more { color: var(--text-muted); font-size: var(--text-sm); }
.popover hr { border: 0; border-top: 1px solid var(--border); margin: var(--space-1) 0; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 70;
  display: flex; align-items: center; gap: var(--space-3); max-width: calc(100vw - 32px);
  padding: 6px 6px 6px var(--space-4); border-radius: var(--radius-md);
  background: var(--text); color: var(--bg); box-shadow: var(--shadow); font-size: var(--text-sm);
}
.toast .btn { min-height: 38px; background: transparent; color: inherit; border-color: transparent; text-decoration: underline; }
.toast .btn:hover { background: rgba(127, 127, 127, .25); }

/* ---------- Dialog extras ---------- */
.dlg footer .left { margin-right: auto; }
.dlg .content:focus { outline: none; }
.dlg .row-btns { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
.thread { position: relative; }
.searchbox {
  width: 100%; min-height: var(--hit); padding: 0 var(--space-3);
  border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 var(--space-3);
  border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); font-size: var(--text-sm);
}
.chipbtn:hover { border-color: var(--border-strong); }
.chipbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.chipbtn i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--swatch-ring); }
.dmc-list { max-height: min(42vh, 360px); overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
.dmc-row {
  display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: var(--hit);
  padding: 4px var(--space-3); border: 0; border-bottom: 1px solid var(--surface-2); background: transparent; text-align: left; font-size: var(--text-sm);
}
.dmc-row:hover { background: var(--surface-2); }
.dmc-row[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-soft-text); }
.dmc-sw { width: 34px; height: 30px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--swatch-ring); flex: none; }
.dmc-num { font-weight: 700; width: 4.2em; flex: none; font-variant-numeric: tabular-nums; }
.dmc-empty { padding: var(--space-4); color: var(--text-muted); font-size: var(--text-sm); text-align: center; }
.dmc-detail { display: flex; align-items: center; gap: var(--space-3); min-height: 48px; font-size: var(--text-sm); }
.dmc-big { width: 72px; height: 48px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--swatch-ring); flex: none; background: var(--surface-sunken); }
.dmc-meta { display: flex; justify-content: space-between; gap: var(--space-2); font-size: var(--text-xs); color: var(--text-muted); }

.optgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.opt {
  min-height: var(--hit); padding: var(--space-2) var(--space-3); text-align: left;
  border: 2px solid var(--border); border-radius: var(--radius-md); background: var(--surface); font-size: var(--text-sm);
}
.opt:hover { border-color: var(--border-strong); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-soft-text); font-weight: 700; }
.lines-preview { display: flex; justify-content: center; padding: var(--space-3); background: var(--surface-sunken); border-radius: var(--radius-md); }
.lines-preview svg { max-width: 100%; height: auto; }
.effect { margin: 0; font-size: var(--text-sm); }
.effect.warn { color: var(--notice-text); background: var(--notice-bg); border: 1px solid var(--notice-border); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }
.effect small { display: block; color: var(--text-muted); font-size: var(--text-xs); margin-top: 2px; }

/* ---------- Mockup-only controls (not part of the design) ---------- */
.mock {
  position: fixed; right: 12px; bottom: 12px; z-index: 60; font-size: var(--text-xs);
  background: #2b2b2b; color: #fff; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: calc(100vw - 24px);
}
.mock summary { padding: 8px 12px; cursor: pointer; font-weight: 700; list-style: none; }
.mock summary::-webkit-details-marker { display: none; }
.mock div { display: flex; flex-direction: column; gap: 6px; padding: 0 12px 12px; }
.mock button { background: #444; color: #fff; border: 0; border-radius: 6px; padding: 8px 10px; text-align: left; }
.mock button:hover { background: #555; }

/* ---------- Responsive ---------- */
@media (max-width: 1500px) { .fit-label { display: none; } }
.lang-short { display: none; }
@media (max-width: 1180px) {
  .lang-long { display: none; }
  .lang-short { display: inline; }
  .file-actions .btn { padding: 0 var(--space-3); }
}
@media (max-width: 980px) {
  :root { --panel-width: 320px; }
  .workspace { gap: var(--space-3); padding: var(--space-3); }
}
@media (max-width: 820px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; min-height: 0; }
  .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
}
@media (max-width: 640px) {
  .topbar { padding: var(--space-3); gap: var(--space-3); }
  .brand { width: 100%; }
  .file-actions { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); }
  .file-actions .btn { width: auto; flex-direction: column; gap: 0; min-height: 52px; font-size: var(--text-xs); white-space: normal; text-align: center; line-height: 1.15; }
  .prefs { width: 100%; justify-content: space-between; }
  .stage-toolbar { gap: var(--space-2); }
  .stage-toolbar .spacer { display: none; }
  .stage-toolbar > .seg { width: 100%; }
  .stage-toolbar > .seg button { flex: 1; padding: 0 var(--space-1); }
  #toolSeg button { flex-direction: column; gap: 0; min-height: 52px; font-size: var(--text-xs); }
  #toolSeg .chip { position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; }
  #toolSeg button { position: relative; }
  .targetbar .tlabel { width: 100%; text-align: center; }
  .targetseg { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); }
  .targetseg button { flex-direction: column; gap: 2px; padding: 4px 2px; min-height: 58px; font-size: 0.75rem; white-space: normal; line-height: 1.1; text-align: center; }
  .targetseg .changed { position: absolute; top: 5px; right: 5px; }
  .endpanel { padding: var(--space-3); }
  .endpanel .actions { width: 100%; }
  .endpanel .actions .btn { flex: 1; }
  .stage-body { padding: var(--space-3); }
  .editor { --ruler: 24px; }
  .panel { display: flex; }
  .card { padding: var(--space-3); }
  .workspace { padding: var(--space-2); }
  .sym-grid { grid-template-columns: 1fr 1fr; }
  .sym svg { width: 34px; height: 34px; }
  .dlg header, .dlg .content, .dlg footer { padding-left: var(--space-4); padding-right: var(--space-4); }
  .dlg footer { flex-wrap: wrap; }
  .dlg footer .left { width: 100%; }
  .toast { bottom: 64px; }
}
</style>

        <div class="seg accent" role="group" id="modeSeg" data-i18n-aria="mode.label">

          <button data-mode="preview" aria-pressed="false"><svg class="icon"><use href="#i-band"/></svg><span data-i18n="mode.preview"></span></button>
        </div>
        <div class="seg" role="group" id="toolSeg" data-i18n-aria="tool.label">
          <button data-tool="cross" aria-pressed="true" data-i18n-title="tool.cross.hint"><svg class="icon"><use href="#i-cross"/></svg><span data-i18n="tool.cross"></span><i class="chip" data-chip></i></button>
          <button data-tool="back" aria-pressed="false" data-i18n-title="tool.back.hint"><svg class="icon"><use href="#i-back"/></svg><span data-i18n="tool.back"></span></button>
          <button data-tool="unpick" aria-pressed="false" data-i18n-title="tool.unpick.hint"><svg class="icon"><use href="#i-unpick"/></svg><span data-i18n="tool.unpick"></span></button>
        </div>
        <div class="toolgroup">
          <button class="btn ghost icon-only" id="undoBtn" data-i18n-title="history.undo" data-i18n-aria="history.undo"><svg class="icon"><use href="#i-undo"/></svg></button>
          <button class="btn ghost icon-only" id="redoBtn" data-i18n-title="history.redo" data-i18n-aria="history.redo"><svg class="icon"><use href="#i-redo"/></svg></button>
        </div>
        <span class="spacer"></span>
        <div class="toolgroup">
          <button class="btn ghost icon-only" id="zoomOut" data-i18n-title="zoom.out" data-i18n-aria="zoom.out"><svg class="icon"><use href="#i-minus"/></svg></button>
          <span class="zoom-label" id="zoomLabel">100 %</span>
          <button class="btn ghost icon-only" id="zoomIn" data-i18n-title="zoom.in" data-i18n-aria="zoom.in"><svg class="icon"><use href="#i-plus"/></svg></button>
          <button class="btn ghost" id="zoomFit" data-i18n-title="zoom.fit.hint"><svg class="icon"><use href="#i-fit"/></svg><span class="fit-label" data-i18n="zoom.fit"></span></button>
        </div>
      </div>

      <div class="stage-body" id="stageBody">
        <!-- Edit view -->
        <div id="editView" class="edit-view">
          <!-- What am I drawing in: the repeat, or one of the four end pieces -->
          <div class="targetbar">
            <span class="tlabel" id="targetLabel" data-i18n="target.label"></span>
            <div class="seg targetseg" role="group" id="targetSeg" aria-labelledby="targetLabel"></div>
          </div>

          <!-- Shown only while an end piece is being edited -->
          <section class="endpanel" id="endPanel" hidden aria-live="polite">
            <div class="who">
              <svg id="endIcon" aria-hidden="true"></svg>
              <div>
                <h3 id="endTitle"></h3>
                <p><span id="endWhere"></span> <span data-i18n="end.explain"></span></p>
                <p class="endsummary" id="endSummary"></p>
              </div>
            </div>
            <div class="ext">
              <label for="endExt" id="endExtLabel"></label>
              <div class="stepper"><button data-estep="-1" data-i18n-aria="step.less">−</button><input id="endExt" type="number" min="0" max="50" value="0" inputmode="numeric"><button data-estep="1" data-i18n-aria="step.more">+</button></div>
              <small data-i18n="end.extra.hint"></small>
            </div>
            <div class="actions">
              <button class="btn danger-text" id="endReset" data-i18n-title="end.reset.hint"><svg class="icon"><use href="#i-reset"/></svg><span data-i18n="end.reset"></span></button>
              <button class="btn primary" id="endDone" data-i18n-title="end.done.hint"><svg class="icon"><use href="#i-check"/></svg><span data-i18n="end.done"></span></button>
            </div>
          </section>

          <div class="edit-layout" id="editLayout">
            <div class="editor" id="editor">
              <div class="corner"></div>
              <div class="ruler ruler-top" id="rulerTop"></div>
              <div class="ruler ruler-left" id="rulerLeft"></div>
              <canvas class="cloth" id="editCanvas"></canvas>
              <div class="popover" id="edgePop" hidden role="dialog">
                <h3><span id="edgePopTitle"></span>
                  <button class="btn close" id="edgePopClose" data-i18n-aria="edge.close" data-i18n-title="edge.close"><svg class="icon"><use href="#i-x"/></svg></button></h3>
                <button class="btn" id="edgeBefore"><svg class="icon"><use href="#i-add"/></svg><span></span></button>
                <button class="btn" id="edgeAfter"><svg class="icon"><use href="#i-add"/></svg><span></span></button>
                <button class="btn danger" id="edgeRemove"><svg class="icon"><use href="#i-trash"/></svg><span></span></button>
                <p class="note" id="edgeNote" hidden></p>
                <hr>
                <button class="btn more" id="edgeMore"><svg class="icon"><use href="#i-rows"/></svg><span data-i18n="edge.more"></span></button>
              </div>
            </div>
            <div class="edit-side">
              <div class="legend" id="legend"></div>
              <p class="hint" id="editHint"></p>
              <section class="miniband">
                <header>
                  <h3 data-i18n="band.mini.title"></h3>
                  <button class="btn ghost" id="miniOpen"><span data-i18n="band.mini.open"></span><svg class="icon"><use href="#i-band"/></svg></button>
                </header>
                <canvas id="miniCanvas"></canvas>
                <p class="hint" data-i18n="band.mini.hint"></p>
              </section>
            </div>
          </div>
        </div>
        <!-- Preview view -->
        <div id="previewView" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
          <div class="preview-wrap"><canvas id="previewCanvas"></canvas></div>
          <p class="caption" id="previewCaption"></p>
          <p class="hint" data-i18n="preview.hint"></p>
        </div>
      </div>
    </section>

    <!-- ===== Side panel ===== -->
    <aside class="panel">
      <!-- Colours -->
      <section class="card" aria-labelledby="hColours">
        <h2 id="hColours" data-i18n="panel.colours"></h2>

        <div class="row" style="margin-top:8px">
          <button class="btn" id="addColour" style="flex:1"><svg class="icon"><use href="#i-add"/></svg><span data-i18n="colours.add"></span></button>

        <div class="toggle-row">

        <div class="bg-row">
          <div class="bg-swatch" id="bgSwatch"></div>

            <input type="color" class="visually-hidden-input" id="bgInput" value="#f5f1e8">
          </label>
        </div>
      </section>

      <!-- Symmetry -->
      <section class="card" aria-labelledby="hSym">
        <h2 id="hSym" data-i18n="panel.symmetry"></h2>
        <p class="intro" data-i18n="symmetry.intro"></p>
        <div class="sym-grid" id="symA"></div>
        <p class="subhead"><span data-i18n="symmetry.squareGroup"></span></p>

          <svg class="icon"><use href="#i-info"/></svg>
          <div><span id="squareNoticeText"></span><br><button class="btn" id="makeSquare"></button></div>
        </div>
        <div class="sym-grid" id="symB"></div>
      </section>

      <!-- Repeat and size -->
      <section class="card" aria-labelledby="hGrid">
        <h2 id="hGrid" data-i18n="panel.grid"></h2>
        <p class="subhead"><span data-i18n="grid.unit"></span><small data-i18n="grid.unit.hint"></small></p>
        <div class="fieldgrid">
          <div class="field"><label for="fW" data-i18n="grid.width"></label>
            <div class="stepper"><button data-step="fW:-1" data-i18n-aria="step.less">−</button><input id="fW" type="number" min="1" max="100" value="12" inputmode="numeric"><button data-step="fW:1" data-i18n-aria="step.more">+</button></div>
            <div class="unit" data-i18n="grid.cells"></div></div>
          <div class="field"><label for="fH" data-i18n="grid.height"></label>
            <div class="stepper"><button data-step="fH:-1" data-i18n-aria="step.less">−</button><input id="fH" type="number" min="1" max="100" value="12" inputmode="numeric"><button data-step="fH:1" data-i18n-aria="step.more">+</button></div>
            <div class="unit" data-i18n="grid.cells"></div></div>
        </div>
        <button class="btn" id="openLines" style="width:100%;margin-top:12px"><svg class="icon"><use href="#i-rows"/></svg><span data-i18n="grid.lines"></span></button>
        <p class="subhead"><span data-i18n="grid.repeats"></span><small data-i18n="grid.repeats.hint"></small></p>
        <div class="fieldgrid">
          <div class="field"><label for="fRX" data-i18n="grid.across"></label>

          <div class="field"><label for="fRY" data-i18n="grid.down"></label>

            <div class="unit" data-i18n="grid.times"></div></div>
        </div>

        <div class="edges">
          <p class="subhead"><span data-i18n="edges.title"></span></p>
          <p class="edges-explain" data-i18n="edges.explain"></p>

            <svg id="edgeSvg" aria-hidden="true"></svg>

        </div>

  </main>
</div>

  let s = `<svg viewBox="-1 -1 ${size+2} ${size+2}" aria-hidden="true"><rect x="0" y="0" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-opacity=".35"/>`;
  for (const [k, v] of cells) { const [x, y] = k.split(",").map(Number);
    s += `<rect x="${x*c+.8}" y="${y*c+.8}" width="${c-1.6}" height="${c-1.6}" rx="1" fill="currentColor" fill-opacity="${v === "s" ? 1 : .45}"/>`; }

function renderAll() {
  $("useSeq").setAttribute("aria-checked", String(doc.useSeq));
  $("bgSwatch").style.backgroundColor = doc.bg; $("bgHex").textContent = doc.bg; $("bgInput").value = doc.bg;
  if (active >= doc.seqs.length) active = 0;
  renderSlots(); updateChip(); renderSym(); renderEdges(); renderTargets(); renderLegend();
  if (mode === "edit") { drawEdit(); drawMini(); } else drawPreview();
  $("zoomLabel").textContent = Math.round(zoom*100) + " %";
  updateHistory();
}
window.addEventListener("resize", () => { renderAll(); renderEdgePop(); });

// URL hash hooks for screenshots: #loading #preview #dialog #dmc #lines #edge #end #back #nonsquare #en #it #dark #light
const HASH = location.hash.slice(1).split(",");
if (HASH.includes("dark")) setTheme("dark"); if (HASH.includes("light")) setTheme("light");
setLang(HASH.includes("en") ? "en" : HASH.includes("it") ? "it" : "nb");
if (HASH.includes("nonsquare")) { doc.h = 9; enforceSquare(); syncFields(); }
if (HASH.includes("end")) setTarget("right");
if (HASH.includes("back")) { setTool("back"); pending = [1, 1]; snap = [4, 1]; }
if (HASH.includes("preview")) setMode("preview"); else renderAll();
if (HASH.includes("edge")) openEdge("col", 5);
if (HASH.includes("dialog")) openSeq(0);
if (HASH.includes("dmc")) openDmc(doc.seqs[0][0], () => {});
if (HASH.includes("lines")) openLines({act: "remove", place: "col", num: 2});
if (HASH.includes("loading")) showLoading(0); else if (!HASH.filter(Boolean).length) showLoading(1600);
if (document.fonts) document.fonts.ready.then(() => { renderAll(); renderEdgePop(); });
</script>
</body>
</html>
